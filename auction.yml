              /** Название для показа игроку: своё имя предмета, иначе русское, иначе английское. */
              public static String of(Item it) {
                  try {
                      if (it.hasCustomName()) {
                          return it.getCustomName();
                      }
                  } catch (Throwable ignored) {
                      // нет метода в этой сборке, идём дальше
