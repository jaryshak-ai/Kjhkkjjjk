          package auction;

          import cn.nukkit.item.enchantment.Enchantment;

          import java.util.HashMap;
          import java.util.Map;

          public final class Enchants {
              public static final Map<Integer, String> NAMES = new HashMap<>();
              public static final String[] ROMAN = {"", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"};

              static {
                  String[] n = {
                          "Защита", "Огнеупорность", "Невесомость", "Взрывоустойчивость", "Защита от снарядов",
                          "Шипы", "Подводное дыхание", "Подводная ходьба", "Подводник", "Острота",
                          "Небесная кара", "Бич членистоногих", "Отдача", "Заговор огня", "Добыча",
                          "Эффективность", "Шёлковое касание", "Прочность", "Удача", "Сила",
                          "Откидывание", "Горящая стрела", "Бесконечность", "Везучий рыбак", "Приманка",
                          "Ледоход", "Починка", "Проклятие несъёмности", "Проклятие утраты", "Пронзатель",
                          "Тягун", "Верность", "Громовержец", "Тройной выстрел", "Пронзающая стрела",
                          "Быстрая перезарядка", "Скорость души"
                  };
                  for (int i = 0; i < n.length; i++) {
                      NAMES.put(i, n[i]);
                  }
              }

              private Enchants() {
              }

              public static String roman(int level) {
                  return level >= 1 && level < ROMAN.length ? ROMAN[level] : String.valueOf(level);
              }

              public static String format(Enchantment[] list) {
                  StringBuilder sb = new StringBuilder();
                  for (Enchantment e : list) {
                      if (e == null) {
                          continue;
                      }
                      if (sb.length() > 0) {
                          sb.append("§7, §f");
                      }
                      sb.append(NAMES.getOrDefault(e.getId(), "Чар #" + e.getId())).append(' ').append(roman(e.getLevel()));
                  }
                  return sb.toString();
              }
          }
          EOF_6
