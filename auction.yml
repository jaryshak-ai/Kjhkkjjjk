          package auction;

          import auction.economy.Economy;
          import cn.nukkit.Player;
          import cn.nukkit.event.player.PlayerFormRespondedEvent;
          import cn.nukkit.form.element.Element;
          import cn.nukkit.form.element.ElementButton;
          import cn.nukkit.form.element.ElementInput;
          import cn.nukkit.form.response.FormResponse;
          import cn.nukkit.form.response.FormResponseCustom;
          import cn.nukkit.form.response.FormResponseModal;
          import cn.nukkit.form.response.FormResponseSimple;
          import cn.nukkit.form.window.FormWindow;
          import cn.nukkit.form.window.FormWindowCustom;
          import cn.nukkit.form.window.FormWindowModal;
          import cn.nukkit.form.window.FormWindowSimple;
          import cn.nukkit.item.Item;
          import cn.nukkit.item.enchantment.Enchantment;

          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.UUID;
          import java.util.function.Consumer;

          /** Меню рынка на формах (FormWindow): работает на любой сборке Nukkit. */
          public class AuctionMenu {
              private static final int PER_PAGE = 8;

              private static class State {
                  boolean mine = false;
                  String search = "";
                  int page = 0;
              }

              private static class Pending {
                  final int formId;
                  final Consumer<PlayerFormRespondedEvent> handler;

                  Pending(int formId, Consumer<PlayerFormRespondedEvent> handler) {
                      this.formId = formId;
                      this.handler = handler;
                  }
              }

              private final AuctionPlugin plugin;
              private final Map<UUID, State> states = new HashMap<>();
              private final Map<UUID, Pending> pending = new HashMap<>();

              public AuctionMenu(AuctionPlugin plugin) {
                  this.plugin = plugin;
              }

              // ================= служебное =================

              public void quit(Player p) {
                  states.remove(p.getUniqueId());
                  pending.remove(p.getUniqueId());
              }

              public void handleForm(PlayerFormRespondedEvent e) {
                  Player p = e.getPlayer();
                  Pending pd = pending.get(p.getUniqueId());
                  if (pd == null || pd.formId != e.getFormID()) {
                      return;
                  }
                  pending.remove(p.getUniqueId());
                  try {
                      pd.handler.accept(e);
                  } catch (Throwable t) {
                      plugin.getLogger().error("[Auction] ошибка формы", t);
                      p.sendMessage("§cОшибка рынка: " + t);
                  }
              }

              private State state(Player p) {
                  return states.computeIfAbsent(p.getUniqueId(), k -> new State());
              }

              /** Показывает форму с небольшой задержкой (так клиент надёжнее её принимает). */
              private void show(Player p, FormWindow w, Consumer<PlayerFormRespondedEvent> handler) {
                  final UUID id = p.getUniqueId();
                  plugin.getServer().getScheduler().scheduleDelayedTask(plugin, () -> {
                      if (!p.isOnline()) {
                          return;
                      }
                      int fid = p.showFormWindow(w);
                      pending.put(id, new Pending(fid, handler));
                  }, 3);
              }

              private static String nameOf(Lot lot) {
                  Item it = lot.toItem();
                  return RuNames.of(it) + (it.getCount() > 1 ? " x" + it.getCount() : "");
              }

              private int clickedId(PlayerFormRespondedEvent e) {
                  if (e.wasClosed()) {
                      return -1;
                  }
                  FormResponse r = e.getResponse();
                  if (r instanceof FormResponseSimple) {
                      return ((FormResponseSimple) r).getClickedButtonId();
                  }
                  return -1;
              }

              // ================= список лотов =================

              public void open(Player p) {
                  State st = state(p);
                  st.page = 0;
                  openList(p);
              }

              private List<Lot> filtered(Player p, State st) {
                  String uid = p.getUniqueId().toString();
                  String q = RuNames.norm(st.search);
                  List<Lot> out = new ArrayList<>();
                  for (Lot l : plugin.lots) {
                      if (st.mine && !uid.equals(l.seller)) {
                          continue;
                      }
                      if (!q.isEmpty()) {
                          Item li = l.toItem();
                          if (!RuNames.norm(RuNames.of(li)).contains(q) && !RuNames.norm(li.getName()).contains(q)) {
                              continue;
                          }
                      }
                      out.add(l);
                  }
                  out.sort((a, b) -> Long.compare(b.created, a.created));
                  return out;
              }

              private void openList(Player p) {
                  final State st = state(p);
                  List<Lot> list = filtered(p, st);
                  int pages = Math.max(1, (list.size() + PER_PAGE - 1) / PER_PAGE);
                  if (st.page >= pages) {
                      st.page = pages - 1;
                  }
                  if (st.page < 0) {
                      st.page = 0;
                  }
                  String uid = p.getUniqueId().toString();

                  StringBuilder content = new StringBuilder();
                  content.append(st.mine ? "§eМои лоты" : "§eВсе лоты")
                          .append("  §7|  Страница §f").append(st.page + 1).append("§7 из §f").append(pages);
                  if (!st.search.isEmpty()) {
                      content.append("\n§7Сейчас ищем: §f").append(st.search);
                  }
                  if (list.isEmpty()) {
                      content.append("\n\n§7Ничего не найдено");
                  } else {
                      content.append("\n\n§7Нажми на лот, чтобы посмотреть и купить");
                  }

                  FormWindowSimple form = new FormWindowSimple("§l§6Рынок", content.toString());
                  final List<Runnable> actions = new ArrayList<>();

                  int from = st.page * PER_PAGE;
                  for (int i = 0; i < PER_PAGE && from + i < list.size(); i++) {
                      final Lot l = list.get(from + i);
                      boolean own = uid.equals(l.seller);
                      form.addButton(new ElementButton((own ? "§2[Ваш] §r§l" : "§l") + nameOf(l)
                              + "\n§r§8" + l.price + " монет | " + l.sellerName));
                      actions.add(() -> openLot(p, l.id));
                  }
                  if (st.page > 0) {
                      form.addButton(new ElementButton("§e◀ Назад"));
                      actions.add(() -> {
                          st.page--;
                          openList(p);
                      });
                  }
                  if (st.page < pages - 1) {
                      form.addButton(new ElementButton("§eВперёд ▶"));
                      actions.add(() -> {
                          st.page++;
                          openList(p);
                      });
                  }
                  form.addButton(new ElementButton("§bПоиск по названию"));
                  actions.add(() -> openSearch(p));
                  if (!st.search.isEmpty()) {
                      form.addButton(new ElementButton("§cСбросить поиск"));
                      actions.add(() -> {
                          st.search = "";
                          st.page = 0;
                          openList(p);
                      });
                  }
                  form.addButton(new ElementButton(st.mine ? "§eВсе лоты" : "§aМои лоты"));
                  actions.add(() -> {
                      st.mine = !st.mine;
                      st.page = 0;
                      openList(p);
                  });
                  form.addButton(new ElementButton("§6Статистика"));
                  actions.add(() -> openStats(p));

                  show(p, form, e -> {
                      int id = clickedId(e);
                      if (id >= 0 && id < actions.size()) {
                          actions.get(id).run();
                      }
                  });
              }

              // ================= карточка лота =================

              private void openLot(Player p, long id) {
                  Lot lot = plugin.findLot(id);
                  if (lot == null) {
                      p.sendMessage("§cЛот уже продан или снят");
                      openList(p);
                      return;
                  }
                  boolean own = p.getUniqueId().toString().equals(lot.seller);
                  Item it = lot.toItem();
                  StringBuilder sb = new StringBuilder();
                  sb.append("§6Предмет: §f").append(RuNames.of(it));
                  if (it.getCount() > 1) {
                      sb.append(" §7x").append(it.getCount());
                  }
                  Enchantment[] en = it.getEnchantments();
                  if (en != null && en.length > 0) {
                      sb.append("\n§6Чары: §f").append(Enchants.format(en));
                  }
                  sb.append("\n§6Цена: §e").append(lot.price).append(" монет");
                  sb.append("\n§6Продавец: §f").append(lot.sellerName);
                  if (!own) {
                      long fee = lot.price * plugin.commission / 100L;
                      sb.append("\n\n§7Комиссия ").append(plugin.commission).append("% (").append(fee).append(") берётся с продавца");
                  }

                  FormWindowSimple form = new FormWindowSimple("§l§6Лот", sb.toString());
                  form.addButton(new ElementButton(own ? "§cСнять с продажи" : "§a§lКупить за " + lot.price));
                  form.addButton(new ElementButton("§e◀ К списку"));

                  final long lotId = id;
                  show(p, form, e -> {
                      int c = clickedId(e);
                      if (c == 0) {
                          if (own) {
                              withdrawOwn(p, lotId);
                          } else {
                              Lot cur = plugin.findLot(lotId);
                              if (cur != null && cur.price > plugin.confirmAbove) {
                                  openConfirm(p, lotId);
                              } else {
                                  purchase(p, lotId);
                              }
                          }
                      } else if (c == 1) {
                          openList(p);
                      }
                  });
              }

              private void openConfirm(Player p, long id) {
                  Lot lot = plugin.findLot(id);
                  if (lot == null) {
                      p.sendMessage("§cЛот уже продан или снят");
                      openList(p);
                      return;
                  }
                  FormWindowModal form = new FormWindowModal("§e§lПодтвердите покупку",
                          "§fКупить §6" + nameOf(lot) + "§f за §e" + lot.price + " монет§f?\n§7Продавец: " + lot.sellerName,
                          "§a§l✔ Купить", "§c§l✖ Отмена");
                  show(p, form, e -> {
                      boolean yes = false;
                      if (!e.wasClosed() && e.getResponse() instanceof FormResponseModal) {
                          yes = ((FormResponseModal) e.getResponse()).getClickedButtonId() == 0;
                      }
                      if (yes) {
                          purchase(p, id);
                      } else {
                          p.sendMessage("§7Покупка отменена");
                          openList(p);
                      }
                  });
              }

              // ================= статистика =================

              private void openStats(Player p) {
                  String uid = p.getUniqueId().toString();
                  long bal = 0;
                  try {
                      bal = plugin.economy.getBalance(p.getName());
                  } catch (Exception ignored) {
                      // баланс покажем нулём
                  }
                  String text = "§7Продано на сумму: §e" + plugin.sold.getOrDefault(uid, 0L)
                          + "\n§7Твоих лотов: §e" + plugin.countLots(p.getUniqueId()) + "§7/§e" + plugin.maxLots
                          + "\n§7Всего лотов на рынке: §e" + plugin.lots.size()
                          + "\n§7Твой баланс: §e" + bal;
                  FormWindowSimple form = new FormWindowSimple("§6§lСтатистика", text);
                  form.addButton(new ElementButton("§e◀ К списку"));
                  show(p, form, e -> openList(p));
              }

              // ================= поиск =================

              private void openSearch(Player p) {
                  final State st = state(p);
                  List<Element> el = new ArrayList<>();
                  el.add(new ElementInput("Название предмета", "например: алмазный меч"));
                  show(p, new FormWindowCustom("§lПоиск на рынке", el), e -> {
                      if (!e.wasClosed() && e.getResponse() instanceof FormResponseCustom) {
                          String in = ((FormResponseCustom) e.getResponse()).getInputResponse(0);
                          st.search = in == null ? "" : in.trim();
                          st.page = 0;
                      }
                      openList(p);
                  });
              }

              // ================= действия =================

              private void withdrawOwn(Player p, long id) {
                  Lot lot = plugin.findLot(id);
                  if (lot == null || !p.getUniqueId().toString().equals(lot.seller)) {
                      p.sendMessage("§cЛот уже продан или снят");
                      openList(p);
                      return;
                  }
                  Item item = lot.toItem();
                  if (!p.getInventory().canAddItem(item)) {
                      p.sendMessage("§cУ вас нет места в инвентаре!");
                      return;
                  }
                  plugin.lots.remove(lot);
                  p.getInventory().addItem(item);
                  plugin.saveData();
                  p.sendMessage("§aЛот снят с продажи, предмет возвращён");
                  openList(p);
              }

              private void purchase(Player p, long id) {
                  String uid = p.getUniqueId().toString();
                  Lot lot = plugin.findLot(id);
                  if (lot == null) {
                      p.sendMessage("§cЛот уже продан или снят");
                      openList(p);
                      return;
                  }
                  if (uid.equals(lot.seller)) {
                      openList(p);
                      return;
                  }
                  Economy eco = plugin.economy;
                  try {
                      eco.ensureAccount(p);
                      String buyer = p.getName();
                      long price = lot.price;
                      long bal = eco.getBalance(buyer);
                      if (bal < price) {
                          p.sendMessage("§cНедостаточно монет! Нужно §e" + price + "§c, у вас §e" + bal);
                          return;
                      }
                      Item item = lot.toItem();
                      if (!p.getInventory().canAddItem(item)) {
                          p.sendMessage("§cУ вас нет места в инвентаре!");
                          return;
                      }
                      long fee = price * plugin.commission / 100L;
                      long payout = price - fee;
                      if (payout > 0 && !eco.canReceive(lot.sellerName, payout)) {
                          p.sendMessage("§cПродавец сейчас не может получить оплату (нет аккаунта или переполнен баланс)");
                          return;
                      }
                      if (!eco.take(buyer, price)) {
                          p.sendMessage("§cНе удалось снять монеты");
                          return;
                      }
                      if (payout > 0 && !eco.add(lot.sellerName, payout)) {
                          eco.add(buyer, price);
                          p.sendMessage("§cОшибка оплаты, монеты возвращены");
                          return;
                      }
                      plugin.lots.remove(lot);
                      plugin.sold.merge(lot.seller, price, Long::sum);
                      p.getInventory().addItem(item);
                      plugin.saveData();

                      String nm = RuNames.of(item) + (item.getCount() > 1 ? " §7x" + item.getCount() : "");
                      p.sendMessage("§aВы купили §f" + nm + " §aза §e" + price + "§a. Баланс: §e" + eco.getBalance(buyer));
                      try {
                          Player sp = plugin.getServer().getOnlinePlayers().get(UUID.fromString(lot.seller));
                          if (sp != null && sp.isOnline()) {
                              sp.sendMessage("§aВаш лот §f" + nm + " §aкуплен игроком §f" + buyer
                                      + "§a. Получено: §e" + payout + " §7(комиссия " + fee + ")");
                          }
                      } catch (Exception ignored) {
                          // продавец не в сети
                      }
                  } catch (Exception e) {
                      plugin.getLogger().error("[Auction] ошибка, этап: оплата", e);
                      p.sendMessage("§cОшибка рынка (оплата): " + e);
                      return;
                  }
                  openList(p);
              }
          }
