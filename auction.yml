          cat > Auction/src/main/java/auction/economy/Economy.java << 'EOF_3'
          package auction.economy;

          import cn.nukkit.Player;

          public interface Economy {
              void ensureAccount(Player player);

              boolean hasAccount(String name);

              long getBalance(String name);

              boolean take(String name, long amount);

              boolean add(String name, long amount);

              boolean canReceive(String name, long amount);
          }
          EOF_3
          cat > Auction/src/main/java/auction/economy/TpCoinsEconomy.java << 'EOF_4'
          package auction.economy;

          import cn.nukkit.Player;
          import cn.nukkit.Server;
          import cn.nukkit.plugin.Plugin;

          import java.lang.reflect.InvocationTargetException;
          import java.lang.reflect.Method;

          /** Мост к плагину TpCoins через рефлексию (TpCoins должен быть на сервере). */
          public class TpCoinsEconomy implements Economy {
              private static final String REASON = "Аукцион";

              private final Object mgr;
              private final Method norm;
              private final Method hasAcc;
              private final Method getBal;
              private final Method getRoom;
              private final Method deposit;
              private final Method withdraw;
              private final Method ensure;

              public TpCoinsEconomy(Server server) throws Exception {
                  Plugin plugin = server.getPluginManager().getPlugin("TpCoins");
                  if (plugin == null) {
                      throw new IllegalStateException("Плагин TpCoins не найден на сервере");
                  }
                  ClassLoader cl = plugin.getClass().getClassLoader();
                  mgr = plugin.getClass().getMethod("getEconomy").invoke(plugin);
                  if (mgr == null) {
                      throw new IllegalStateException("TpCoins ещё не готов (getEconomy вернул null)");
                  }
                  Class<?> players = Class.forName("tpcoins.util.Players", true, cl);
                  norm = players.getMethod("norm", String.class);
                  Class<?> m = mgr.getClass();
                  hasAcc = m.getMethod("hasAccount", String.class);
                  getBal = m.getMethod("getBalance", String.class);
                  getRoom = m.getMethod("getRoom", String.class);
                  deposit = m.getMethod("deposit", String.class, long.class, String.class);
                  withdraw = m.getMethod("withdraw", String.class, long.class, String.class);
                  ensure = m.getMethod("ensureAccount", Player.class);
              }

              private String key(String name) throws Exception {
                  return (String) norm.invoke(null, name);
              }

              private static RuntimeException wrap(Exception e) {
                  if (e instanceof InvocationTargetException && e.getCause() != null) {
                      Throwable c = e.getCause();
                      return c instanceof RuntimeException ? (RuntimeException) c : new RuntimeException(c);
                  }
                  return new RuntimeException(e);
              }

              @Override
              public void ensureAccount(Player player) {
                  try {
                      ensure.invoke(mgr, player);
                  } catch (Exception e) {
                      throw wrap(e);
                  }
              }

              @Override
              public boolean hasAccount(String name) {
                  try {
                      return (Boolean) hasAcc.invoke(mgr, key(name));
                  } catch (Exception e) {
                      throw wrap(e);
                  }
              }

              @Override
              public long getBalance(String name) {
                  try {
                      String k = key(name);
                      if (!(Boolean) hasAcc.invoke(mgr, k)) {
                          return 0L;
                      }
                      return (Long) getBal.invoke(mgr, k);
                  } catch (Exception e) {
                      throw wrap(e);
                  }
              }

              @Override
              public boolean take(String name, long amount) {
                  if (amount <= 0) {
                      return false;
                  }
                  try {
                      return "OK".equals(String.valueOf(withdraw.invoke(mgr, key(name), amount, REASON)));
                  } catch (Exception e) {
                      throw wrap(e);
                  }
              }

              @Override
              public boolean add(String name, long amount) {
                  if (amount <= 0) {
                      return false;
                  }
                  try {
                      return "OK".equals(String.valueOf(deposit.invoke(mgr, key(name), amount, REASON)));
                  } catch (Exception e) {
                      throw wrap(e);
                  }
              }

              @Override
              public boolean canReceive(String name, long amount) {
                  try {
                      String k = key(name);
                      if (!(Boolean) hasAcc.invoke(mgr, k)) {
                          return false;
                      }
                      return (Long) getRoom.invoke(mgr, k) >= amount;
                  } catch (Exception e) {
                      throw wrap(e);
                  }
              }
          }
          EOF_4
          cat > Auction/src/main/java/auction/Lot.java << 'EOF_5'
          package auction;

          import cn.nukkit.item.Item;

          import java.util.Base64;
          import java.util.UUID;

          /** Лот на рынке. Формат полей совместим со старым lots.json. */
          public class Lot {
              public long id;
              public String seller;
              public String sellerName;
              public long price;
              public int itemId;
              public int meta;
              public int count;
              public String nbt = "";
              public long created;
              private transient Item cached;

              public Lot() {
              }

              public static Lot of(long id, UUID seller, String sellerName, long price, Item item) {
                  Lot l = new Lot();
                  l.id = id;
                  l.seller = seller.toString();
                  l.sellerName = sellerName;
                  l.price = price;
                  l.itemId = item.getId();
                  l.meta = item.getDamage();
                  l.count = item.getCount();
                  byte[] tag = item.getCompoundTag();
                  l.nbt = (tag == null || tag.length == 0) ? "" : Base64.getEncoder().encodeToString(tag);
                  l.created = System.currentTimeMillis();
                  l.cached = item.clone();
                  return l;
              }

              public Item toItem() {
                  if (cached == null) {
                      Item it = Item.get(itemId, Integer.valueOf(meta), count);
                      if (nbt != null && !nbt.isEmpty()) {
                          it.setCompoundTag(Base64.getDecoder().decode(nbt));
                      }
                      cached = it;
                  }
                  return cached.clone();
              }
          }
          EOF_5
