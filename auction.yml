                      case 159:
                          r = meta < 16 ? FEM[meta] + " терракота" : "Терракота";
                          break;
                      case 160:
                          r = meta < 16 ? FEM[meta] + " стеклянная панель" : "Стеклянная панель";
                          break;
                      case 171:
                          r = meta < 16 ? MASC[meta] + " ковёр" : "Ковёр";
                          break;
                      case 236:
                          r = meta < 16 ? MASC[meta] + " бетон" : "Бетон";
                          break;
                      case 237:
                          r = meta < 16 ? MASC[meta] + " цементный порошок" : "Цементный порошок";
                          break;
                      case 241:
                          r = meta < 16 ? NEUT[meta] + " стекло" : "Стекло";
                          break;
                      case 351:
                          r = pick(DYES, meta, "Краситель");
                          break;
                      case 263:
                          r = meta == 1 ? "Древесный уголь" : "Уголь";
                          break;
                      case 322:
                          r = meta == 1 ? "Зачарованное золотое яблоко" : "Золотое яблоко";
                          break;
                      default:
                          r = NAMES.get(id);
                          break;
                  }
                  return r != null ? r : it.getName();
              }

              /** Для поиска: нижний регистр, без цветовых кодов, ё = е. */
              public static String norm(String s) {
                  if (s == null) {
                      return "";
                  }
                  return s.replaceAll("§.", "").toLowerCase().replace('ё', 'е').trim();
              }
