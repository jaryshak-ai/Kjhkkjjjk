          package auction;

          import auction.economy.Economy;
          import auction.economy.TpCoinsEconomy;
          import cn.nukkit.Player;
          import cn.nukkit.command.Command;
          import cn.nukkit.command.CommandSender;
          import cn.nukkit.event.EventHandler;
          import cn.nukkit.event.Listener;
          import cn.nukkit.event.player.PlayerFormRespondedEvent;
          import cn.nukkit.event.player.PlayerQuitEvent;
          import cn.nukkit.item.Item;
          import cn.nukkit.plugin.PluginBase;
          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import com.google.gson.reflect.TypeToken;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStreamReader;
          import java.io.OutputStreamWriter;
          import java.io.Reader;
          import java.io.Writer;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.StandardCopyOption;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.UUID;

          public class AuctionPlugin extends PluginBase implements Listener {
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();

              public Economy economy;
              public final List<Lot> lots = new ArrayList<>();
              public final Map<String, Long> sold = new HashMap<>();
              public int commission = 3;
              public int maxLots = 10;
              public long maxPrice = 300000;
              public long confirmAbove = 50000;

              private long nextId = 1;
              private boolean loaded;
              private File lotsFile;
              private File statsFile;
              private AuctionMenu menu;

              @Override
              public void onEnable() {
                  saveDefaultConfig();
                  commission = Math.max(0, Math.min(99, getConfig().getInt("commission-percent", 3)));
                  maxLots = Math.max(1, getConfig().getInt("max-lots-per-player", 10));
                  maxPrice = Math.max(1L, getConfig().getLong("max-price", 300000L));
                  confirmAbove = Math.max(0L, getConfig().getLong("confirm-above", 50000L));

                  getDataFolder().mkdirs();
                  lotsFile = new File(getDataFolder(), "lots.json");
                  statsFile = new File(getDataFolder(), "stats.json");

                  try {
                      economy = new TpCoinsEconomy(getServer());
                  } catch (Exception e) {
                      getLogger().error("Не удалось подключиться к TpCoins, плагин выключен", e);
                      getServer().getPluginManager().disablePlugin(this);
                      return;
                  }

                  loadData();
                  menu = new AuctionMenu(this);
                  getServer().getPluginManager().registerEvents(this, this);
                  getLogger().info("Auction включён, лотов: " + lots.size());
              }

              @Override
              public void onDisable() {
                  saveData();
              }

              // ---------- данные ----------

              private void loadData() {
                  boolean ok = true;
                  try {
                      if (lotsFile.exists()) {
                          try (Reader r = new InputStreamReader(new FileInputStream(lotsFile), StandardCharsets.UTF_8)) {
                              List<Lot> l = GSON.fromJson(r, new TypeToken<List<Lot>>() {
                              }.getType());
                              if (l != null) {
                                  lots.addAll(l);
                              }
                          }
                      }
                      if (statsFile.exists()) {
                          try (Reader r = new InputStreamReader(new FileInputStream(statsFile), StandardCharsets.UTF_8)) {
                              Map<String, Long> m = GSON.fromJson(r, new TypeToken<Map<String, Long>>() {
                              }.getType());
                              if (m != null) {
                                  sold.putAll(m);
                              }
                          }
                      }
                  } catch (Exception e) {
                      ok = false;
                      getLogger().error("Не удалось прочитать данные рынка", e);
                  }
                  loaded = ok;
                  for (Lot l : lots) {
                      nextId = Math.max(nextId, l.id + 1);
                  }
              }

              public void saveData() {
                  if (!loaded) {
                      return;
                  }
                  try {
                      write(lotsFile, GSON.toJson(lots));
                      write(statsFile, GSON.toJson(sold));
                  } catch (Exception e) {
                      getLogger().error("Не удалось сохранить данные рынка", e);
                  }
              }

              private void write(File f, String json) throws IOException {
                  File tmp = new File(f.getPath() + ".tmp");
                  try (Writer w = new OutputStreamWriter(new FileOutputStream(tmp), StandardCharsets.UTF_8)) {
                      w.write(json);
                  }
                  Files.move(tmp.toPath(), f.toPath(), StandardCopyOption.REPLACE_EXISTING);
              }

              public Lot findLot(long id) {
                  for (Lot l : lots) {
                      if (l.id == id) {
                          return l;
                      }
                  }
                  return null;
              }

              public int countLots(UUID seller) {
                  String s = seller.toString();
                  int n = 0;
                  for (Lot l : lots) {
                      if (s.equals(l.seller)) {
                          n++;
                      }
                  }
                  return n;
              }

              public void refreshAll() {
                  // формы показывают актуальные данные при каждом открытии, обновлять нечего
              }

              // ---------- команды ----------

              @Override
              public boolean onCommand(CommandSender sender, Command command, String label, String[] args) {
                  String name = command.getName().toLowerCase();
                  if (!(sender instanceof Player)) {
                      sender.sendMessage("§cТолько для игроков");
                      return true;
                  }
                  Player p = (Player) sender;
                  switch (name) {
                      case "auc":
                          menu.open(p);
                          return true;
                      case "bal":
                          try {
                              economy.ensureAccount(p);
                              p.sendMessage("§aВаш баланс: §e" + economy.getBalance(p.getName()) + " §aмонет");
                          } catch (Exception e) {
                              getLogger().error("Ошибка /bal", e);
                              p.sendMessage("§cНе удалось получить баланс");
                          }
                          return true;
                      case "sell":
                          sell(p, args);
                          return true;
                      default:
                          return false;
                  }
              }

              private void sell(Player p, String[] args) {
                  if (args.length != 1) {
                      p.sendMessage("§cИспользование: /sell <цена>");
                      return;
                  }
                  long price;
                  try {
                      price = Long.parseLong(args[0].trim());
                  } catch (NumberFormatException e) {
                      p.sendMessage("§cЦена должна быть числом");
                      return;
                  }
                  if (price < 1 || price > maxPrice) {
                      p.sendMessage("§cЦена должна быть от 1 до " + maxPrice);
                      return;
                  }
                  Item hand = p.getInventory().getItemInHand();
                  if (hand == null || hand.getId() == 0 || hand.getCount() <= 0) {
                      p.sendMessage("§cВозьмите предмет в руку");
                      return;
                  }
                  if (countLots(p.getUniqueId()) >= maxLots) {
                      p.sendMessage("§cМаксимум " + maxLots + " лотов одновременно");
                      return;
                  }
                  try {
                      economy.ensureAccount(p);
                  } catch (Exception e) {
                      getLogger().error("ensureAccount при /sell", e);
                  }
                  Item item = hand.clone();
                  Lot lot = Lot.of(nextId++, p.getUniqueId(), p.getName(), price, item);
                  lots.add(lot);
                  p.getInventory().setItemInHand(Item.get(0));
                  saveData();
                  String nm = RuNames.of(item) + (item.getCount() > 1 ? " §7x" + item.getCount() : "");
                  p.sendMessage("§aВыставлено: §f" + nm + " §aза §e" + price + "§a. Комиссия " + commission + "% удержится при продаже.");
                  refreshAll();
              }

              // ---------- события ----------

              @EventHandler
              public void onForm(PlayerFormRespondedEvent e) {
                  if (menu != null) {
                      menu.handleForm(e);
                  }
              }

              @EventHandler
              public void onQuit(PlayerQuitEvent e) {
                  if (menu != null) {
                      menu.quit(e.getPlayer());
                  }
              }
          }
